name: plausible-ui-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: plausible_dev
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d plausible_dev"]
      interval: 3s
      timeout: 3s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:24.12-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8123/ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  plausible:
    build:
      context: ..
      dockerfile: custom/Dockerfile.dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      MIX_ENV: ce_dev
      NODE_ENV: development
      CUSTOM_DISABLE_TYPECHECK_WATCHER: "true"
      LISTEN_IP: 0.0.0.0
      BASE_URL: http://localhost:${PLAUSIBLE_DEV_PORT:-8100}
      HTTP_PORT: "8000"
      SECURE_COOKIE: "false"
      SELFHOST: "true"
      DISABLE_CRON: "true"
      DISABLE_REGISTRATION: "false"
      LOG_LEVEL: info
      MAILER_ADAPTER: Bamboo.LocalAdapter
      S3_DISABLED: "true"
      VERIFICATION_ENABLED: "false"
      PLAUSIBLE_SEED_PROFILE: light
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/plausible_dev
      CLICKHOUSE_DATABASE_URL: http://clickhouse:8123/plausible_events_db
      SECRET_KEY_BASE: local-development-only-secret-key-base-00000000000000000000000000000000
      TOTP_VAULT_KEY: Q3BD4nddbkVJIPXgHuo5NthGKSIH0yesRfG05J88HIo=
    ports:
      - "127.0.0.1:${PLAUSIBLE_DEV_PORT:-8100}:8000"
    volumes:
      - ..:/app
      - mix-deps:/app/deps
      - mix-build:/app/_build
      - assets-node-modules:/app/assets/node_modules
      - tracker-node-modules:/app/tracker/node_modules
      - tracker-js:/app/priv/tracker/js
      - tracker-support:/app/priv/tracker/installation_support
      - static-css:/app/priv/static/css
      - static-js:/app/priv/static/js
      - geodb:/app/priv/geodb
      - dev-state:/var/lib/plausible-dev
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8000/api/system/health/ready",
        ]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 5m

volumes:
  postgres-data:
  clickhouse-data:
  mix-deps:
  mix-build:
  assets-node-modules:
  tracker-node-modules:
  tracker-js:
  tracker-support:
  static-css:
  static-js:
  geodb:
  dev-state:
